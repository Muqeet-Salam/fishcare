<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Image Classifier</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2rem;
      max-width: 600px;
      margin: auto;
    }
    h1 {
      text-align: center;
    }
    #result {
      margin-top: 1rem;
      font-weight: bold;
    }
    .prediction {
      margin-bottom: 10px;
    }
    .confidence {
      color: green;
      font-weight: normal;
    }
  </style>
</head>
<body>
  <h1>Upload Image for Classification</h1>

  <input type="file" id="imageInput" accept="image/*" />
  <button id="uploadBtn">Upload and Classify</button>

  <div id="result"></div>

  <script>
    const uploadBtn = document.getElementById('uploadBtn');
    const imageInput = document.getElementById('imageInput');
    const resultDiv = document.getElementById('result');

    // Change this URL to your deployed backend endpoint
    const backendUrl = "https://59bbc38e-8487-48ec-9f92-189abd6ad69f-00-2ls10hbd79cp2.kirk.replit.dev/upload-image/";

    uploadBtn.addEventListener('click', async () => {
      const file = imageInput.files[0];
      if (!file) {
        resultDiv.textContent = 'Please select an image first.';
        return;
      }

      const formData = new FormData();
      formData.append('file', file);

      resultDiv.textContent = 'Classifying...';

      try {
        const response = await fetch(backendUrl, {
          method: 'POST',
          body: formData
        });

        if (!response.ok) {
          const errorData = await response.json();
          resultDiv.textContent = `Error: ${errorData.error || response.statusText}`;
          return;
        }

        const data = await response.json();

        // Clear previous results
        resultDiv.innerHTML = '';

        // Loop through predictions and display them with confidence scores
        data.predictions.forEach((prediction, index) => {
          const confidence = data.confidence_scores[index];
          const predictionElement = document.createElement('div');
          predictionElement.classList.add('prediction');
          predictionElement.innerHTML = `
            <strong>${prediction}</strong>
            <span class="confidence">(${(confidence * 100).toFixed(2)}% confidence)</span>
          `;
          resultDiv.appendChild(predictionElement);
        });

      } catch (error) {
        resultDiv.textContent = 'Error: ' + error.message;
      }
    });
  </script>
</body>
</html>
